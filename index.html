<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#160f2e" />
  <title>Bubble Card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Quicksand:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/bubbles.css" />
  <link rel="stylesheet" href="css/letter.css" />
  <link rel="stylesheet" href="css/screens.css" />
  <link rel="stylesheet" href="css/panels.css" />
  <link rel="stylesheet" href="css/lock.css" />
</head>
<body>
  <!-- nền vũ trụ: sao, hành tinh, sao băng -->
  <canvas id="space"></canvas>

  <!-- quầng sáng nền (tinh vân) -->
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>

  <!-- vùng bong bóng (JS đổ vào) -->
  <div id="field" aria-label="Những bong bóng lời nhắn"></div>

  <!-- thanh tiến trình -->
  <div id="topbar"><span id="progress" class="progress"></span></div>

  <!-- gợi ý chạm -->
  <div id="hint">Chạm vào một bong bóng để đọc lời nhắn 💌</div>

  <!-- cụm nút góc dưới trái -->
  <div id="tools">
    <button id="gridBtn" class="tool-btn" title="Xem toàn bộ lời nhắn"
      aria-label="Xem toàn bộ lời nhắn">&#9636;</button>
    <button id="modeBtn" class="tool-btn" title="Đổi kiểu chuyển động bong bóng"
      aria-label="Đổi kiểu chuyển động bong bóng">&#8645;</button>
    <button id="resetBtn" class="tool-btn" title="Đặt lại trạng thái đã đọc"
      aria-label="Đặt lại trạng thái đã đọc">↺</button>
  </div>
  <div id="modeToast"></div>

  <!-- lớp phủ khi mở thư -->
  <div id="overlay" hidden>
    <div id="backdrop"></div>
    <article id="letter">
      <div class="accent"></div>
      <button id="closeBtn" class="close" aria-label="Đóng thư">&times;</button>
      <div id="scroll" class="letter-scroll">
        <p id="from" class="from"></p>
        <div id="body" class="body"></div>
        <p id="sign" class="sign"></p>
      </div>
      <div class="nav">
        <button id="prev" class="nav-btn" aria-label="Thư trước">&larr;</button>
        <span id="count" class="count"></span>
        <button id="next" class="nav-btn" aria-label="Thư sau">&rarr;</button>
      </div>
    </article>
  </div>

  <!-- màn chào -->
  <div id="welcome" class="screen">
    <div class="screen-inner">
      <p id="eyebrow" class="eyebrow"></p>
      <h1 id="gtitle" class="screen-title"></h1>
      <p id="gsub" class="subtitle"></p>
      <button id="openBtn" class="btn"></button>
    </div>
  </div>

  <!-- màn kết -->
  <div id="finale" class="screen" hidden>
    <div class="screen-inner">
      <div class="finale-badge">🎉</div>
      <h2 id="ftitle" class="screen-title"></h2>
      <p id="fmsg" class="subtitle"></p>
      <div class="finale-actions">
        <button id="gridFromFinale" class="btn">Xem lại toàn bộ thư 📖</button>
        <button id="finaleClose" class="btn btn-ghost">Xem lại những bong bóng</button>
      </div>
    </div>
  </div>

  <!-- màn xem toàn bộ lời nhắn -->
  <div id="gridView" hidden>
    <div class="grid-head">
      <h2>Toàn bộ lời nhắn</h2>
      <p class="grid-sub">Đã đọc <span id="gridCount"></span> · chạm lá thư chưa mở để đọc</p>
    </div>
    <button id="gridClose" aria-label="Đóng">&times;</button>
    <div id="gridBody" class="grid-body"></div>
  </div>

  <!-- màn nhập mã bí mật -->
  <div id="lock" hidden>
    <div class="lock-card" id="lockCard">
      <div class="lock-emblem">🔒</div>
      <h2 class="lock-title">Những dòng này đang được giữ kín 🤍</h2>
      <p class="lock-desc">Đây là những lời nhắn riêng gửi đến cô. Cô nhập mã (in kèm món quà) để mở nhé ạ.</p>
      <div class="code-boxes" id="codeBoxes">
        <input class="code-box" maxlength="1" inputmode="text" autocomplete="off" aria-label="Ký tự 1" />
        <input class="code-box" maxlength="1" inputmode="text" autocomplete="off" aria-label="Ký tự 2" />
        <input class="code-box" maxlength="1" inputmode="text" autocomplete="off" aria-label="Ký tự 3" />
        <input class="code-box" maxlength="1" inputmode="text" autocomplete="off" aria-label="Ký tự 4" />
        <input class="code-box" maxlength="1" inputmode="text" autocomplete="off" aria-label="Ký tự 5" />
        <input class="code-box" maxlength="1" inputmode="text" autocomplete="off" aria-label="Ký tự 6" />
      </div>
      <p class="lock-msg" id="lockMsg"></p>
      <button class="lock-cancel" id="lockCancel" type="button">Để sau</button>
    </div>
  </div>

  <!-- pháo giấy -->
  <canvas id="confetti"></canvas>

  <script type="module" src="js/main.js"></script>
</body>
</html>
